name: Create Governed Project
# Onboards a governed tenant: writes governed/<name>/platform/app-values.yaml,
# checks it against the platform's guardrails (sedemo-platform/governed-teams),
# and pushes it to main. The governed-team-projects ApplicationSet then creates
# the gov-<name> Kargo project and the gov-<name>-dev/-staging/-prod apps.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Tenant name (e.g. orders). Lowercase letters, numbers, dashes. Becomes Kargo project gov-<name>."
        required: true
        type: string
      imageRepository:
        description: "Image repository. Must be from an approved registry (ghcr.io/akuity/)."
        required: true
        type: string
        default: ghcr.io/akuity/sedemo-monorepo-rollouts-app
      selectionStrategy:
        description: "How the Warehouse picks image tags."
        type: choice
        options: [NewestBuild, SemVer, Lexical, Digest]
        default: NewestBuild
      tagRegex:
        description: "Only tags matching this regex become Freight."
        type: string
        default: '^\d*-[a-z]*$'
      deployMethod:
        description: "argocd: Kargo renders, Argo CD syncs. github-actions: Kargo runs your workflow at each stage."
        type: choice
        options: [argocd, github-actions]
        default: argocd
      ghaRepo:
        description: "github-actions only: repo with the deploy workflow (must be under github.com/akuity/)."
        type: string
        default: https://github.com/akuity/sedemo-platform
      ghaWorkflow:
        description: "github-actions only: workflow file in .github/workflows (takes inputs environment and version)."
        type: string
        default: example-github-action.yaml
      ghaRef:
        description: "github-actions only: branch or tag to run the workflow from."
        type: string
        default: main
      ingressPrefix:
        description: "argocd only: URL prefix (dev.<prefix>.akpdemoapps.link). Empty = <name>-gov."
        type: string
        default: ""
      purposeLabel:
        description: "argocd only: labels.purpose, required by the prod policy check. Empty = <name>-api."
        type: string
        default: ""
      rolloutsEnabled:
        description: "argocd only: canary Rollout (on) or plain Deployment (off)."
        type: boolean
        default: true
      replicaCount:
        description: "Replicas per environment."
        type: string
        default: "2"
      s3Enabled:
        description: "Give the app an S3 bucket (gov-<name>-<env>-bucket)."
        type: boolean
        default: false
      slackEnabled:
        description: "Send promotion events to the kargo-notifications Slack channel."
        type: boolean
        default: false
      devSteps:
        description: "Extra steps in dev (tier 2), comma-separated, in order. Any of: trivy-image, grype, opa-test, kyverno-policy-apply, gitleaks-scan, extract-images, http, hello-world, random-number, teams-notify, send-message, wait-for-approval"
        type: string
        default: ""
      stagingSteps:
        description: "Extra steps in staging (tier 2), comma-separated, in order. Same list as devSteps."
        type: string
        default: ""
      devCustomSteps:
        description: "Your own dev steps, run after devSteps. Delete the leading # to use the example, or replace it. One step {...} or several [{...}, {...}]. Checked by the platform guardrails. The new app-values.yaml lists an example of every allowed step."
        type: string
        default: '# {uses: http, as: my-check, config: {method: GET, url: "https://example.com", successExpression: "response.status == 200"}}'
      stagingCustomSteps:
        description: "Your own staging steps, run after stagingSteps. Same format as devCustomSteps; leave the # to skip."
        type: string
        default: '# {uses: wait-for-approval, as: my-approval, config: {}}'
      stepsBlocking:
        description: "Extra steps block the promotion when they fail (off = report only). http and notifications never block; wait-for-approval always does."
        type: boolean
        default: false
      qaStage:
        description: "Add a qa environment between dev and staging (tier 3, auto-promoted)."
        type: boolean
        default: false
      smokeTestStage:
        description: "argocd only: add a smoke-test stage after staging that checks the staging URL (tier 3)."
        type: boolean
        default: false

concurrency:
  group: governed-tenants
  cancel-in-progress: false

jobs:
  create-governed-tenant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAME: ${{ inputs.name }}
      IMAGE_REPO: ${{ inputs.imageRepository }}
      SELECTION: ${{ inputs.selectionStrategy }}
      TAG_REGEX: ${{ inputs.tagRegex }}
      DEPLOY_METHOD: ${{ inputs.deployMethod }}
      GHA_REPO: ${{ inputs.ghaRepo }}
      GHA_WORKFLOW: ${{ inputs.ghaWorkflow }}
      GHA_REF: ${{ inputs.ghaRef }}
      INGRESS_PREFIX: ${{ inputs.ingressPrefix }}
      PURPOSE: ${{ inputs.purposeLabel }}
      ROLLOUTS: ${{ inputs.rolloutsEnabled }}
      REPLICAS: ${{ inputs.replicaCount }}
      S3: ${{ inputs.s3Enabled }}
      SLACK: ${{ inputs.slackEnabled }}
      DEV_STEPS: ${{ inputs.devSteps }}
      STAGING_STEPS: ${{ inputs.stagingSteps }}
      DEV_CUSTOM: ${{ inputs.devCustomSteps }}
      STAGING_CUSTOM: ${{ inputs.stagingCustomSteps }}
      BLOCKING: ${{ inputs.stepsBlocking }}
      QA: ${{ inputs.qaStage }}
      SMOKE: ${{ inputs.smokeTestStage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout platform charts
        uses: actions/checkout@v4
        with:
          repository: akuity/sedemo-platform
          path: .platform

      - name: Check inputs
        id: vars
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "$NAME" =~ ^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$ ]] \
            || fail "name '$NAME' must be lowercase letters, numbers and dashes (max 40), starting and ending with a letter or number."
          [ "$NAME" != "template" ] || fail "'template' is reserved."
          [ ! -e "governed/$NAME" ] || fail "governed/$NAME already exists. Run Delete Governed Project first, or edit the file directly."
          [[ "$REPLICAS" =~ ^[0-9]+$ ]] && [ "$REPLICAS" -ge 1 ] && [ "$REPLICAS" -le 10 ] \
            || fail "replicaCount must be a number from 1 to 10."

          if [ "$DEPLOY_METHOD" = "argocd" ]; then
            PREFIX="${INGRESS_PREFIX:-$NAME-gov}"
            PURPOSE="${PURPOSE:-$NAME-api}"
            [[ "$PREFIX" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]] \
              || fail "ingressPrefix '$PREFIX' must be a DNS label (lowercase letters, numbers, dashes)."
            [[ "$PURPOSE" =~ ^[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$ ]] \
              || fail "purposeLabel '$PURPOSE' isn't a valid Kubernetes label value."
            if [ -n "$(grep -rlE "custom_prefix:[[:space:]]*['\"]?$PREFIX['\"]?[[:space:]]*$" governed/ templated/ 2>/dev/null)" ]; then
              fail "ingress prefix '$PREFIX' is already used by another team. Pick another ingressPrefix."
            fi
            echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
            echo "purpose=$PURPOSE" >> "$GITHUB_OUTPUT"
          else
            [ -n "$GHA_REPO" ] && [ -n "$GHA_WORKFLOW" ] && [ -n "$GHA_REF" ] \
              || fail "deployMethod github-actions needs ghaRepo, ghaWorkflow and ghaRef."
            [ "$SMOKE" != "true" ] \
              || fail "smokeTestStage checks the staging URL, which only Argo CD tenants have. Turn it off for github-actions."
          fi

          # Extra steps: each must be on the platform's allowlist (read live from
          # platform-controls.yaml) and one this workflow knows how to configure.
          ALLOWED="$(yq '.allowedTenantSteps[]' .platform/governed-teams/kargo-chart/platform-controls.yaml)"
          KNOWN="trivy-image grype opa-test kyverno-policy-apply gitleaks-scan extract-images http hello-world random-number teams-notify send-message wait-for-approval"
          # These read the rendered manifests or the source checkout, which only Argo CD tenants have.
          NEEDS_WORKSPACE="opa-test kyverno-policy-apply gitleaks-scan extract-images http"
          for env in dev staging; do
            var="$(echo "$env" | tr a-z A-Z)_STEPS"
            list="$(echo "${!var}" | tr ',' ' ' | xargs -n1 2>/dev/null || true)"
            [ -z "$(echo "$list" | sort | uniq -d)" ] || fail "${env}Steps lists $(echo "$list" | sort | uniq -d | head -1) twice."
            for s in $list; do
              echo "$ALLOWED" | grep -qx -- "$s" \
                || fail "${env}Steps: '$s' isn't on the platform's allowed step list: $(echo $ALLOWED | tr ' ' ',')."
              [[ " $KNOWN " == *" $s "* ]] \
                || fail "${env}Steps: '$s' is allowed by the platform, but this workflow doesn't know how to configure it yet."
              if [ "$DEPLOY_METHOD" != "argocd" ] && [[ " $NEEDS_WORKSPACE " == *" $s "* ]]; then
                fail "${env}Steps: '$s' needs the rendered manifests or the app's URL, which only Argo CD tenants have."
              fi
            done

            # Free-form steps: only the shape is checked here. Which steps and
            # settings are allowed is up to the platform guardrails (next steps).
            # Empty or starting with # (the prefilled example) means none.
            var="$(echo "$env" | tr a-z A-Z)_CUSTOM"
            custom="${!var}"; first="${custom#"${custom%%[![:space:]]*}"}"
            if [ -n "$first" ] && [ "${first:0:1}" != "#" ]; then
              # One step or a list; every item a map with 'uses'.
              n="$(printf '%s' "$custom" | yq '[] + . | length' 2>/dev/null)" \
                && bad="$(printf '%s' "$custom" | yq '([] + .) | [.[] | select(tag != "!!map" or (has("uses") | not))] | length' 2>/dev/null)" \
                && [ "$n" -gt 0 ] && [ "$bad" -eq 0 ] \
                || fail "${env}CustomSteps must be one step {uses: ..., config: {...}} or a list [{...}, {...}], each with 'uses'."
            fi
          done

      - name: Write app-values.yaml
        env:
          PREFIX: ${{ steps.vars.outputs.prefix }}
          PURPOSE: ${{ steps.vars.outputs.purpose }}
          # Built in two parts so GitHub doesn't evaluate it: it's a Kargo expression.
          KARGO_OPEN: "$"
        run: |
          set -euo pipefail
          DIR="governed/$NAME/platform"
          FILE="$DIR/app-values.yaml"
          BODY="$(mktemp)"
          mkdir -p "$DIR"
          export IMAGE_REF="${IMAGE_REPO}:${KARGO_OPEN}{{ imageFrom('${IMAGE_REPO}').Tag }}"
          export CONTINUE=$([ "$BLOCKING" = "true" ] && echo false || echo true)
          y() { yq -i "$1" "$BODY"; }

          # Tier 1: settings
          y '.image.repository = strenv(IMAGE_REPO)
            | .image.selectionStrategy = strenv(SELECTION)
            | .image.tagRegex = strenv(TAG_REGEX) | .image.tagRegex style="single"'
          if [ "$DEPLOY_METHOD" = "argocd" ]; then
            y '.ingress.custom_prefix = strenv(PREFIX) | .rollouts.enabled = env(ROLLOUTS)'
          else
            y '.deploy.method = "github-actions"
              | .deploy.githubActions.repo = strenv(GHA_REPO)
              | .deploy.githubActions.workflow = strenv(GHA_WORKFLOW)
              | .deploy.githubActions.ref = strenv(GHA_REF)'
          fi
          y '.replicaCount = env(REPLICAS) | .environments.staging = true'
          [ "$DEPLOY_METHOD" = "argocd" ] && y '.labels.purpose = strenv(PURPOSE)'
          [ "$S3" = "true" ] && y '.services.s3.enabled = true'
          [ "$SLACK" = "true" ] && y '.notifications.slack.enabled = true'

          # Tier 2: extra steps in dev and staging, from the platform's allowlist.
          # They run after the manifests render into ./out and before anything is
          # committed. ./chart is sedemo-platform, ./src is this repo (Argo CD tenants).
          export TAG_EXPR="${KARGO_OPEN}{{ imageFrom('${IMAGE_REPO}').Tag }}"
          export FREIGHT_EXPR="${KARGO_OPEN}{{ ctx.targetFreight.name }}"
          export TEAMS_HOOK_EXPR="${KARGO_OPEN}{{ secret(\"teams-webhook\")[\"teams-webhook\"] }}"
          add_step() { # $1 = dev|staging, $2 = step
            export ENV_NAME="$1" STEP="$2" ALIAS="$1-$2" STEP_CONTINUE="$CONTINUE"
            case "$2" in
              trivy-image|grype) CONFIG='{"image": strenv(IMAGE_REF)}' ;;
              opa-test)          CONFIG='{"path": "./out"}' ;;
              extract-images)    CONFIG='{"path": "out"}' ;;
              kyverno-policy-apply) # prod's own policy check, run early
                CONFIG='{"policy": "./chart/governed-teams/policies/prod-policies.yaml", "resource": "./out/manifests.yaml"}' ;;
              gitleaks-scan)     # the same folder prod's secret scan checks
                export SCAN_PATH="./src/$(yq '.checks.secretScan.path' .platform/governed-teams/kargo-chart/platform-controls.yaml)"
                CONFIG='{"path": strenv(SCAN_PATH)}' ;;
              http) # Runs before this promotion deploys, so it checks the version
                    # already running (and fails on the first promotion): never blocks.
                export URL="https://$1.$PREFIX.akpdemoapps.link/" STEP_CONTINUE=true
                CONFIG='{"method": "GET", "url": strenv(URL), "successExpression": "response.status == 200"}' ;;
              hello-world)
                export MSG="Hello from gov-$NAME, promoting to $1"
                CONFIG='{"message": strenv(MSG)}' ;;
              random-number)     CONFIG='{"range": 100}' ;;
              teams-notify) # needs a teams-webhook Secret in the gov-<name> project
                export TITLE="gov-$NAME: promoting to $1" MSG="$IMAGE_REPO:$TAG_EXPR" STEP_CONTINUE=true
                CONFIG='{"webhookURL": strenv(TEAMS_HOOK_EXPR), "title": strenv(TITLE), "message": strenv(MSG), "stage": strenv(ENV_NAME), "freight": strenv(FREIGHT_EXPR)}' ;;
              send-message) # posts to the kargo-notifications channel (slackEnabled)
                export MSG="gov-$NAME: promoting $IMAGE_REPO:$TAG_EXPR to $1" STEP_CONTINUE=true
                CONFIG='{"channel": {"kind": "MessageChannel", "name": "kargo-notifications"}, "message": strenv(MSG)}' ;;
              wait-for-approval) # pauses the promotion until someone approves it in Kargo
                STEP_CONTINUE=false
                CONFIG='{}' ;;
            esac
            y ".pipeline.$1.extraSteps += [{\"uses\": strenv(STEP), \"as\": strenv(ALIAS), \"continueOnError\": env(STEP_CONTINUE), \"config\": $CONFIG}]"
          }
          NOTES=""
          for env in dev staging; do
            var="$(echo "$env" | tr a-z A-Z)_STEPS"
            for s in $(echo "${!var}" | tr ',' ' '); do
              add_step "$env" "$s"
              case "$s" in
                send-message) y '.notifications.slack.enabled = true'
                  NOTES="$NOTES- send-message posts to the kargo-notifications Slack channel, so Slack notifications are turned on.\n" ;;
                teams-notify)
                  NOTES="$NOTES- teams-notify needs a Secret named \`teams-webhook\` (key \`teams-webhook\`) in the \`gov-$NAME\` Kargo project. Until it exists the step reports an error but doesn't block.\n" ;;
                wait-for-approval)
                  NOTES="$NOTES- wait-for-approval in $env: every promotion to $env waits for someone to approve it in Kargo.\n" ;;
                http)
                  NOTES="$NOTES- http in $env checks the version already running in $env (tenant steps run before the deploy), so it fails on the first promotion. It's report-only.\n" ;;
              esac
            done
          done
          [ -z "$NOTES" ] || printf "## Notes on the extra steps\n\n$NOTES\n" >> "$GITHUB_STEP_SUMMARY"

          # Free-form steps go after the preset ones, exactly as written.
          for env in dev staging; do
            var="$(echo "$env" | tr a-z A-Z)_CUSTOM"
            export CUSTOM="${!var}"; first="${CUSTOM#"${CUSTOM%%[![:space:]]*}"}"
            [ -n "$first" ] && [ "${first:0:1}" != "#" ] || continue
            y ".pipeline.$env.extraSteps += ([] + (strenv(CUSTOM) | from_yaml) | (... style=\"\"))"
            if [ "$(yq ".pipeline.$env.extraSteps[] | select(.uses == \"send-message\") | .uses" "$BODY")" != "" ]; then
              y '.notifications.slack.enabled = true'
            fi
            DUP="$(yq ".pipeline.$env.extraSteps[].as | select(. != null)" "$BODY" | sort | uniq -d | head -1)"
            if [ -n "$DUP" ]; then
              echo "::error::${env}CustomSteps: the alias '$DUP' is used twice in $env (preset steps are named $env-<step>)."
              exit 1
            fi
          done

          # Tier 3: the team's own stages
          if [ "$QA" = "true" ]; then
            y '.pipeline.extraStages += [{"name": "qa", "after": "dev", "deploy": true, "autoPromote": true}]
              | .pipeline.staging.after = ["qa"]'
            if [ "$DEPLOY_METHOD" = "argocd" ]; then
              export URL="https://qa.$PREFIX.akpdemoapps.link/"
              y '(.pipeline.extraStages[] | select(.name == "qa")).steps = [{"uses": "http", "as": "qa-smoke-test", "retry": {"timeout": "5m"},
                  "config": {"method": "GET", "url": strenv(URL), "successExpression": "response.status == 200"}}]'
            fi
          fi
          if [ "$SMOKE" = "true" ]; then
            export URL="https://staging.$PREFIX.akpdemoapps.link/"
            y '.pipeline.extraStages += [{"name": "smoke-test", "after": "staging", "steps": [{"uses": "http", "as": "check-staging",
                "config": {"method": "GET", "url": strenv(URL), "successExpression": "response.status == 200"}}]}]'
          fi

          # Commented-out examples at the end of the file, so the team can add
          # steps and stages later by editing it. Filled in with their image and URLs.
          STEP_EX="$(mktemp)" STAGE_EX="$(mktemp)"
          if [ "$DEPLOY_METHOD" = "argocd" ]; then
            CHECK_URL="https://dev.$PREFIX.akpdemoapps.link/"
          else
            CHECK_URL="https://example.com/health"
          fi
          cat > "$STEP_EX" <<EOF
          - uses: http                  # call a URL and check the response
            as: my-check
            retry: {timeout: 2m}
            config:
              method: GET
              url: $CHECK_URL
              successExpression: response.status == 200
          - uses: trivy-image           # scan the image for vulnerabilities
            as: my-trivy
            continueOnError: true
            config:
              image: "$IMAGE_REF"
          - uses: grype                 # a second vulnerability scanner
            as: my-grype
            continueOnError: true
            config:
              image: "$IMAGE_REF"
          - uses: hello-world           # print a message
            as: my-hello
            config:
              message: "Promoting to ${KARGO_OPEN}{{ ctx.stage }}"
          - uses: random-number         # pick a number from 1 to range
            as: my-roll
            config:
              range: 6
          - uses: teams-notify          # needs a teams-webhook Secret in the gov-$NAME project
            as: my-teams
            continueOnError: true
            config:
              webhookURL: "${KARGO_OPEN}{{ secret('teams-webhook')['teams-webhook'] }}"
              title: "Promoting to ${KARGO_OPEN}{{ ctx.stage }}"
              message: "New release"
              stage: "${KARGO_OPEN}{{ ctx.stage }}"
              freight: "${KARGO_OPEN}{{ ctx.targetFreight.name }}"
          - uses: send-message          # post to Slack; also set notifications.slack.enabled: true
            as: my-slack
            continueOnError: true
            config:
              channel: {kind: MessageChannel, name: kargo-notifications}
              message: "Promoting to ${KARGO_OPEN}{{ ctx.stage }}"
          - uses: wait-for-approval     # pause until someone approves in Kargo
            as: my-approval
            config: {}
          EOF
          if [ "$DEPLOY_METHOD" = "argocd" ]; then
            cat >> "$STEP_EX" <<EOF
          - uses: opa-test              # OPA (conftest) policies on the rendered manifests
            as: my-opa
            config:
              path: ./out
          - uses: kyverno-policy-apply  # prod's Kyverno policies, run early
            as: my-policy
            config:
              policy: ./chart/governed-teams/policies/prod-policies.yaml
              resource: ./out/manifests.yaml
          - uses: gitleaks-scan         # look for secrets in the app's source
            as: my-secret-scan
            config:
              path: ./src/rollouts-app
          - uses: extract-images        # list the images in the rendered manifests
            as: my-images
            config:
              path: out
          EOF
          fi
          cat > "$STAGE_EX" <<EOF
          pipeline:
            extraStages:
            - name: my-qa               # lowercase; not dev, staging or anything with "prod"
              after: dev                # dev, staging, or one of your stages listed above it
              deploy: true              # a real environment; false = steps only
              autoPromote: true
            - name: my-check
              after: staging
              steps:
              - uses: hello-world
                config:
                  message: "staging looks good"
            staging:
              after: [my-qa]            # staging waits for my-qa instead of dev
          EOF

          {
            echo "# Tenant: $NAME. Created by the Create Governed Project workflow"
            echo "# (run by $GITHUB_ACTOR, $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo "# Settings reference: sedemo-platform/governed-teams/kargo-chart/values.yaml"
            echo
            cat "$BODY"
            echo
            echo "# ---------------------------------------------------------------------------"
            echo "# Adding steps and stages later"
            echo "#"
            echo "# Edit this file and push to main. The platform checks it first: if something"
            echo "# isn't allowed, the error shows on the gov-$NAME-kargo app in Argo CD and"
            echo "# nothing changes. Prod's checks are the same for every team and can't be"
            echo "# changed here."
            echo "#"
            echo "# Steps go in a list under pipeline.dev.extraSteps or pipeline.staging.extraSteps"
            echo "# (add the keys above if they aren't there). They run after the manifests are"
            echo "# rendered and before anything is deployed. Each step takes:"
            echo "#   uses             the step (one of the examples below)"
            echo "#   as               a name, unique within the environment"
            echo "#   config           the step's settings"
            echo "#   continueOnError  true: report a failure but don't stop the promotion"
            echo "#   if               only run when this Kargo expression is true"
            echo "#   retry            e.g. {timeout: 5m}"
            echo "#"
            echo "# Every step the platform allows:"
            echo "#"
            sed 's/^/# /' "$STEP_EX"
            echo "#"
            echo "# Your own stages (up to 5) go under pipeline.extraStages. For example, a qa"
            echo "# environment between dev and staging, and a check after staging:"
            echo "#"
            sed 's/^/# /' "$STAGE_EX"
          } > "$FILE"
          echo "file=$FILE" >> "$GITHUB_ENV"
          cat "$FILE"

      - name: Check against platform guardrails
        run: |
          set -uo pipefail
          OUT="$(mktemp)"
          if .platform/governed-teams/tests/render.sh "$file" >"$OUT" 2>&1; then
            {
              echo "## Tenant \`$NAME\` passes the platform guardrails"
              echo
              echo "It will create:"
              echo '```'; cat "$OUT"; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT"
          else
            {
              echo "## Tenant \`$NAME\` rejected by the platform guardrails"
              echo
              echo "Nothing was committed."
              echo '```'; cat "$OUT"; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT"
            echo "::error::$(grep -m1 GUARDRAIL "$OUT" || tail -1 "$OUT")"
            exit 1
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config --global user.name "Akuity Bot"
          git config --global user.email "akuitybot@akuity.io"
          git add "governed/$NAME/"
          git commit -m "Add governed tenant $NAME"
          git pull --rebase origin main
          git push origin main

      - name: Next steps
        env:
          PREFIX: ${{ steps.vars.outputs.prefix }}
        run: |
          {
            echo
            echo "## Next steps"
            echo
            echo "- The ApplicationSet creates \`gov-$NAME-appsets\` within a few minutes, then the Kargo project \`gov-$NAME\`."
            echo "- If nothing shows up in Kargo, check the \`gov-$NAME-kargo\` app in Argo CD."
            if [ "$DEPLOY_METHOD" = "argocd" ]; then
              echo "- URLs: https://dev.$PREFIX.akpdemoapps.link, https://staging.$PREFIX.akpdemoapps.link, https://prod.$PREFIX.akpdemoapps.link"
            fi
            echo "- First promotions: promote **image** Freight to each Stage before chart Freight. If an auto-promotion of chart Freight errored with \`imageFrom(...)\`, promote the image Freight to that Stage."
            if [ "$QA" = "true" ] || [ "$SMOKE" = "true" ]; then
              echo "- Wait for each new environment's certificate (\`curl -sI https://<stage>.$PREFIX.akpdemoapps.link/\` returns 200) before promoting to a stage with an http check."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
