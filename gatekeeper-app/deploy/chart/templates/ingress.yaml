apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatekeeper-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: "{{ .Release.Namespace }}.{{ .Values.ingress.root_domain }}"
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: gatekeeper-svc
            port:
              number: 80
