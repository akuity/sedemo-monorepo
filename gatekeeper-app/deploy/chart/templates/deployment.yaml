apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatekeeper-app
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: gatekeeper-app
  template:
    metadata:
      labels:
        app: gatekeeper-app
    spec:
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          name: gatekeeper-app
          ports:
            - containerPort: 80
          env:
            - name: STAGE
              value: {{ .Values.kargo.stage }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
  minReadySeconds: 10
  revisionHistoryLimit: 3
