# Tenant: rader. Created by the Create Governed Project workflow
# (run by dhpup, https://github.com/akuity/sedemo-monorepo/actions/runs/41710212899).
# Settings reference: sedemo-platform/governed-teams/kargo-chart/values.yaml

image:
  repository: ghcr.io/akuity/sedemo-monorepo-rollouts-app
  selectionStrategy: NewestBuild
  tagRegex: '^\d*-[a-z]*$'
ingress:
  custom_prefix: rader-gov
rollouts:
  enabled: true
replicaCount: 1
environments:
  staging: true
labels:
  purpose: rader-api
pipeline:
  dev:
    extraSteps:
      - uses: random-number
        as: dev-random-number
        continueOnError: false
        config:
          range: 100
      - uses: trivy-image
        as: dev-trivy-image
        continueOnError: false
        config:
          image: ghcr.io/akuity/sedemo-monorepo-rollouts-app:${{ imageFrom('ghcr.io/akuity/sedemo-monorepo-rollouts-app').Tag }}
  extraStages:
    - name: staging-post
      after: staging
      autoPromote: true
      steps:
        - uses: hello-world
          as: staging-hello-world
          continueOnError: false
          config:
            message: Hello from gov-rader, deployed to staging
    - name: smoke-test
      after: staging
      steps:
        - uses: http
          as: check-staging
          config:
            method: GET
            url: https://staging.rader-gov.akpdemoapps.link/
            successExpression: response.status == 200

# ---------------------------------------------------------------------------
# Adding steps and stages later
#
# Edit this file and push to main. The platform checks it first: if something
# isn't allowed, the error shows on the gov-rader-kargo app in Argo CD and
# nothing changes. Prod's checks are the same for every team and can't be
# changed here.
#
# Steps go in a list under pipeline.dev.extraSteps or pipeline.staging.extraSteps
# (add the keys above if they aren't there). They run after the manifests are
# rendered and before anything is deployed. For steps after a deploy, put them
# in a stage of your own that comes after it (see the stages example below).
# Each step takes:
#   uses             the step (one of the examples below)
#   as               a name, unique within the environment
#   config           the step's settings
#   continueOnError  true: report a failure but don't stop the promotion
#   if               only run when this Kargo expression is true
#   retry            e.g. {timeout: 5m}
#
# Every step the platform allows:
#
# - uses: http                  # call a URL and check the response
#   as: my-check
#   retry: {timeout: 2m}
#   config:
#     method: GET
